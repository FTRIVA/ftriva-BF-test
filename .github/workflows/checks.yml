name: FTRIVA checks

on:
  push:
    branches: [main, "fix/**", "digital-delivery-test"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and browser JavaScript
        run: npm run check
